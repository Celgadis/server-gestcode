# Configuració de base de dades MySQL per a l'entorn de test
spring.datasource.url=jdbc:mysql://localhost:3306/gestcode_test
spring.datasource.username=gestcode
spring.datasource.password=gestcode
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate i JPA
# Hibernate crearà i esborrarà les taules en cada execució de tests
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
# Eliminat el dialecte explícit per permetre l'autodetecció (Hibernate 6)

# Poblar dades de test necessàries (usuaris admin, test1, test2, etc.)

app.seed.testdata=true
app.seed.testdata.password=test1234
app.default.admin.password=admin1234

# Altres configuracions
jwt.secret=EsUnaContrasenyaPerDefecteMentresDesenvolupo!!Cambila!!MillorEncaraFesUnaVariableDeEntorn
